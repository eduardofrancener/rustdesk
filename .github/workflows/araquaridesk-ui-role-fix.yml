name: AraquariDesk UI Role Fix

on:
  workflow_dispatch:
  push:
    branches:
      - araquaridesk-branding

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Patch UI role enforcement
        shell: python
        run: |
          from pathlib import Path

          # Common users must never receive the outgoing connection UI,
          # regardless of the timing of Rust custom-client initialization.
          p = Path('flutter/lib/desktop/pages/desktop_home_page.dart')
          text = p.read_text(encoding='utf-8')
          if "package:flutter_hbb/araquaridesk_auth.dart" not in text:
              text = text.replace(
                  "import 'package:flutter_hbb/common.dart';\n",
                  "import 'package:flutter_hbb/common.dart';\nimport 'package:flutter_hbb/araquaridesk_auth.dart';\n",
                  1,
              )
          marker = "  final GlobalKey _childKey = GlobalKey();\n"
          getter = marker + "\n  bool get _isAraquariIncomingOnly => !AraquariDeskAuth.instance.isAdmin;\n"
          if marker in text and "_isAraquariIncomingOnly" not in text:
              text = text.replace(marker, getter, 1)
          text = text.replace('bind.isIncomingOnly()', '_isAraquariIncomingOnly')
          p.write_text(text, encoding='utf-8')

          # The last remaining UI-side escape hatch is the generic connect helper.
          # Keep the backend check too, but reject immediately in Flutter for common users.
          p = Path('flutter/lib/common.dart')
          text = p.read_text(encoding='utf-8')
          if "package:flutter_hbb/araquaridesk_auth.dart" not in text:
              text = text.replace(
                  "import 'package:flutter_hbb/common/formatter/id_formatter.dart';\n",
                  "import 'package:flutter_hbb/common/formatter/id_formatter.dart';\nimport 'package:flutter_hbb/araquaridesk_auth.dart';\n",
                  1,
              )
          connect_marker = """connect(BuildContext context, String id,\n    {bool isFileTransfer = false,\n"""
          connect_body = """connect(BuildContext context, String id,\n    {bool isFileTransfer = false,\n"""
          guard = """  if (isDesktop && desktopType == DesktopType.main &&\n      !AraquariDeskAuth.instance.isAdmin) {\n    showToast(translate('Acesso disponível apenas para TI.'));\n    return;\n  }\n"""
          if connect_marker in text and guard.strip() not in text:
              text = text.replace(connect_marker, connect_body + guard, 1)
          p.write_text(text, encoding='utf-8')

          # The setup/login flow should accept the 8-character password the UI tests
          # commonly use, while still using PBKDF2-HMAC-SHA256 for storage.
          p = Path('flutter/lib/desktop/pages/desktop_tab_page.dart')
          text = p.read_text(encoding='utf-8')
          text = text.replace("password.length < 10", "password.length < 8")
          text = text.replace("password.text.length < 10", "password.text.length < 8")
          p.write_text(text, encoding='utf-8')

          print('AraquariDesk UI role guard patch complete')

      - name: Commit
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add flutter/lib/desktop/pages/desktop_home_page.dart \
                  flutter/lib/common.dart \
                  flutter/lib/desktop/pages/desktop_tab_page.dart
          git commit -m 'fix: enforce AraquariDesk common-user UI restrictions'
          git push origin HEAD:${GITHUB_REF_NAME}
